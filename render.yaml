services:
  # PostgreSQL Database
  - type: pspg
    name: stock-rating-db
    plan: free
    databaseName: stock_rating
    databaseUser: stock_rating_user

  # Python FastAPI Service (vnstock)
  - type: web
    name: stock-rating-api
    env: python
    plan: free
    rootDir: vnstock_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.12.0

  # Next.js Web Service
  - type: web
    name: stock-rating-web
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stock-rating-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_VNSTOCK_SERVICE_URL
        sync: false
        fromService:
          name: stock-rating-api
          type: web
          property: host
    healthCheckPath: /
